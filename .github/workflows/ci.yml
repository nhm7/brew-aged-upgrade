name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: "./libexec"
          severity: warning
      - name: Ruff lint
        run: pipx run ruff check libexec/
      - name: Ruff format check
        run: pipx run ruff format --check libexec/
      - name: Ruby syntax
        run: ruby -c Formula/aged-upgrade.rb
