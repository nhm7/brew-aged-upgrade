name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Need full history to push the formula update back to main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute archive SHA256
        id: archive
        run: |
          TAG="${GITHUB_REF_NAME}"
          URL="https://github.com/${{ github.repository }}/archive/refs/tags/${TAG}.tar.gz"
          SHA=$(curl -sL "$URL" | sha256sum | awk '{print $1}')
          echo "url=${URL}"          >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA}"       >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}"    >> "$GITHUB_OUTPUT"

      - name: Update formula
        run: |
          python3 .github/scripts/update-formula.py \
            "${{ steps.archive.outputs.url }}"     \
            "${{ steps.archive.outputs.sha256 }}"  \
            "${{ steps.archive.outputs.version }}"

      - name: Commit formula back to main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/brew-aged-upgrade.rb
          git diff --cached --quiet \
            || git commit -m "chore: update formula to ${{ github.ref_name }}"
          git push origin HEAD:main

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --generate-notes \
            --latest
