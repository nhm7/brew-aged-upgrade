name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/checkout@v6
        if: steps.release.outputs.release_created
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Compute archive SHA256
        if: steps.release.outputs.release_created
        id: archive
        run: |
          TAG="${{ steps.release.outputs.tag_name }}"
          URL="https://github.com/${{ github.repository }}/archive/refs/tags/${TAG}.tar.gz"
          SHA=""
          for i in 1 2 3 4 5; do
            SHA=$(curl -sL "$URL" | sha256sum | awk '{print $1}')
            [ -n "$SHA" ] && break
            sleep $((i * 3))
          done
          echo "url=${URL}"    >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Update formula
        if: steps.release.outputs.release_created
        run: |
          python3 .github/scripts/update-formula.py \
            "${{ steps.archive.outputs.url }}"     \
            "${{ steps.archive.outputs.sha256 }}"  \
            "${{ steps.release.outputs.version }}"
          git config user.name  "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          git add Formula/brew-aged-upgrade.rb
          git diff --cached --quiet \
            || git commit -m "chore: update formula to ${{ steps.release.outputs.tag_name }} [skip ci]"
          git push origin HEAD:main
